# DoRun config example.
# Copy this file to DoRun.yaml and place it next to DoRun.exe,
# or under %APPDATA%\DoRun\DoRun.yaml.

# Launcher hotkey:
# 1 = MOD_ALT
# 2 = MOD_CONTROL
# 4 = MOD_SHIFT
# 8 = MOD_WIN
HOTKEY_MODIFIERS: 1
HOTKEY_VK: 32
HOTKEY_DEBUG_LOG: false

# Launcher-scoped hotkey that copies the selected result's command line to the
# clipboard while the launcher is open. Same modifier syntax as Command.conf
# hotkeys: ^ = Ctrl, ! = Alt, + = Shift, @ = Win.
# Defaults to `^+c` when unset. Leave empty or set to `none` to disable.
COPY_COMMAND_HOTKEY: '^+c'

# Automatically reload DoRun.yaml and Command.conf every N seconds.
# 0 (the default) disables the periodic reload; edits are then only applied
# when the files change on disk, via `/reload`, or `DoRun.exe /reload`.
CONFIG_AUTO_RELOAD_SECONDS: 0

# Ditto-like clipboard text history.
# The popup hotkey uses the same modifier syntax as Command.conf hotkeys
# (^ = Ctrl, ! = Alt, + = Shift, @ = Win) and is global while DoRun runs.
# Tapping the hotkey again steps the selection down; releasing its modifiers
# pastes the selected entry. Shift+hotkey steps up (when Shift is not already
# part of the hotkey). A hotkey without modifiers (e.g. F8) ends the sequence
# after a short pause instead.
CLIPBOARD_HISTORY_ENABLED: true
CLIPBOARD_HOTKEY: '^`'
CLIPBOARD_HISTORY_MAX_ROWS: 500
CLIPBOARD_VISIBLE_ITEM_COUNT: 12

# Launcher appearance.
# `LAUNCHER_CORNER_RADIUS` uses pixels after DPI scaling. Set to 0 to disable rounded corners.
# `LAUNCHER_OPACITY` uses the Win32 alpha range 32-255. Set to 255 for a fully opaque window.
# `LAUNCHER_VISIBLE_ITEM_COUNT` controls how many result rows are visible without scrolling.
# `LAUNCHER_SEARCH_FONT_FAMILY` and `LAUNCHER_RESULT_FONT_FAMILY` override the font face. Leave empty to follow the system default.
# `LAUNCHER_SEARCH_FONT_SIZE` and `LAUNCHER_RESULT_FONT_SIZE` use point sizes. Set to 0 to follow the system default.
# Color settings accept `#RRGGBB` or `RRGGBB`.
LAUNCHER_CORNER_RADIUS: 18
LAUNCHER_OPACITY: 245
LAUNCHER_VISIBLE_ITEM_COUNT: 8
LAUNCHER_SEARCH_FONT_FAMILY: ''
LAUNCHER_RESULT_FONT_FAMILY: ''
LAUNCHER_SEARCH_FONT_SIZE: 0
LAUNCHER_RESULT_FONT_SIZE: 0
LAUNCHER_BG_COLOR: '#F3F6F9'
LAUNCHER_BORDER_COLOR: '#DAE0E8'
LAUNCHER_TEXT_COLOR: '#1C2026'
LAUNCHER_SUBTLE_TEXT_COLOR: '#68717E'
LAUNCHER_ACCENT_COLOR: '#2666E6'
LAUNCHER_SEARCH_BG_COLOR: '#FCFDFF'

# Optional variables that Command.conf can reference as `${NAME}`.
# Define new variables under `VARS` to avoid conflicts with DoRun settings.
# For compatibility, old top-level scalar variables still work, but `VARS` wins.
# `EDITOR` is used by `/config` and `/cmdconfig`.
# `VIEWER` is used by `/view`. When empty, falls back to `EDITOR` then Shell.
# `VIEWER` can reference `${EDITOR}`, e.g.: '${EDITOR} --view'
# Runtime variables `${CMD}`, `${CWD}`, and `${CWD_FLAG}` expand at launch time:
#   - `${CMD}`       → the item's command line (useful in wrapper templates)
#   - `${CWD}`       → the item's working directory
#   - `${CWD_FLAG}`  → the directory argument for the terminal (use in Command.conf templates)
# Define `${CWD_FLAG}` here in VARS; it can reference `${CWD}` which stays as a runtime literal.
VARS:
  EDITOR: ''
  VIEWER: ''
  TERMINAL: 'wt.exe'
  CWD_FLAG: '-d "${CWD}"'

# Optional alias DSL integration using aliasc.
# DoRun compiles this file for PowerShell, CMD, and POSIX shells.
# The compiler defaults to C:\~\Scoop\apps\aliasc\current\aliasc.exe,
# then falls back to `scoopx aliasc`.
ALIASES:
  FILE: 'C:\~\.config\alias'
  COMPILER: 'C:\~\Scoop\apps\aliasc\current\aliasc.exe'
  # 0 = SW_HIDE (no console window for alias items), 1 = SW_SHOWNORMAL (default).
  #SHOW_WINDOW: 0
  # Show each alias definition body in the launcher preview (default 1).
  # Set to 0 to show the generic "aliasc PowerShell alias: <name>" text instead.
  #SHOW_DEFINITION: 0
  # Optional. ShortcutMap.yaml for aliasc. When unset, aliasc reads
  # %USERPROFILE%\.config\ShortcutMap.yaml, falling back to a
  # ShortcutMap.yaml beside the alias source.
  # FILE and SHORTCUT_MAP are independent sources; the map still imports
  # when FILE is missing, and SHORTCUT_MAP may be used on its own.
  #SHORTCUT_MAP: 'C:\~\.config\ShortcutMap.yaml'

HISTORY_ENABLED: 1
HISTORY_DB_PATH: ''
HISTORY_RANK_SUM_LIMIT: 5000
HISTORY_DECAY_FACTOR: 0.9
HISTORY_PRUNE_BELOW: 1
HISTORY_MAX_ROWS: 5000
HISTORY_RECENCY_ENABLED: 1
HISTORY_FUZZY_ENABLED: 1

# Global defaults for directory indexing.
INDEX_INCLUDE_PATHEXT: true
INDEX_RECURSIVE: true
INDEX_EXTENSIONS:
  - '.exe'
  - '.lnk'

# Each indexed directory is defined once and can override the globals above.
DIR:
  - PATH: 'C:\Windows\System32'
    INDEX_RECURSIVE: false

  - PATH: 'C:\Program Files'
    INDEX_INCLUDE_PATHEXT: false
    INDEX_EXTENSIONS:
      - '.exe'
      - '.lnk'
      - '.cmd'
    # Exclude subdirectories from this PATH. Relative entries are resolved under PATH.
    INDEX_EXCLUDE_DIRS:
      - 'WindowsApps'
      - 'Common Files'

  - PATH: 'C:\Program Files (x86)'
